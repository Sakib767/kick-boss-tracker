name: Kick Stream Tracker

on:
  schedule:
    - cron: '10 */5 * * *' 
  workflow_dispatch: 

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip' # 👈 Python প্যাকেজের জন্য ক্যাশ

      - name: Cache APT Packages (Tesseract & FFmpeg)
        uses: actions/cache@v4
        id: apt-cache
        with:
          path: |
            /var/cache/apt/archives
            /var/lib/apt/lists
          key: ${{ runner.os }}-apt-${{ hashFiles('**/scan.yml') }}
          restore-keys: |
            ${{ runner.os }}-apt-

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr libtesseract-dev ffmpeg

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt # 👈 ফাইল থেকে ইনস্টল হবে

      - name: Run Tracker Script
        env:
          KICK_URL: ${{ secrets.KICK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          python tracker.py
