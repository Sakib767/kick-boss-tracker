name: Kick Visual Scan

on:
  schedule:
    - cron: "*/50 * * * *"   # প্রতি ঘণ্টার ০ এবং ৫০ মিনিটে ট্রিগার হবে
  workflow_dispatch:      

# নতুন রান শুরু হলে পুরনো রান সাথে সাথে বাতিল হবে (জিরো ওভারল্যাপ)
concurrency:
  group: "kick-tracker"
  cancel-in-progress: true  

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 360   # ৫ ঘণ্টা স্ক্যানের জন্য ৬ ঘণ্টা লিমিট দেওয়া হলো
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr libtesseract-dev ffmpeg libgl1

      - name: Install Python deps
        run: |
          pip install --upgrade pip
          pip install yt-dlp opencv-python-headless pytesseract requests

      - name: Run tracker
        env:
          KICK_URL: ${{ secrets.KICK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONUNBUFFERED: 1
        run: python tracker.py
