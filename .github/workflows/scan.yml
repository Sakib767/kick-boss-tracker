name: Kick Visual Scan

on:
  schedule:
    - cron: "0 */5 * * *"   # 👈 প্রতি ৫ ঘণ্টায় একবার চালু হবে
  workflow_dispatch:        # ম্যানুয়ালি রান করার অপশন

concurrency:
  group: "kick-tracker"
  cancel-in-progress: true  

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 330   
    steps:
      - uses: actions/checkout@v4

      # 👇 Deno ইনস্টল (yt-dlp এর জন্য জরুরি)
      - name: Install Deno (For yt-dlp)
        uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x

      - name: Cache apt packages
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: ${{ runner.os }}-apt-${{ hashFiles('**/scan.yml') }}
          restore-keys: |
            ${{ runner.os }}-apt-

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/scan.yml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr libtesseract-dev ffmpeg libgl1

      - name: Install Python deps
        run: |
          pip install --upgrade pip
          # 👇 curl_cffi এবং requirements.txt থেকে ইনস্টল করা হচ্ছে
          pip install "curl_cffi>=0.10.0,<0.16"
          pip install -r requirements.txt

      - name: Run tracker
        env:
          KICK_URL: ${{ secrets.KICK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          KICK_CURL: ${{ secrets.KICK_CURL }} 
          PYTHONUNBUFFERED: 1
        run: python tracker.py
