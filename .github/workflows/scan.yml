name: Kick Visual Scan

on:
  schedule:
    - cron: "0 */2 * * *"   # 👈 প্রতি ৫ ঘণ্টায় একবার অটোমেটিক চালু হবে
  workflow_dispatch:        # ম্যানুয়ালি রান করার অপশনও থাকবে

# নতুন রান শুরু হলে পুরনো রান বাতিল হবে (যাতে একসাথে দুটো না চলে)
concurrency:
  group: "kick-tracker"
  cancel-in-progress: true  

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 330   
    steps:
      - uses: actions/checkout@v4

      - name: Cache apt packages
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: ${{ runner.os }}-apt-${{ hashFiles('**/scan.yml') }}
          restore-keys: |
            ${{ runner.os }}-apt-

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/scan.yml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr libtesseract-dev ffmpeg libgl1

      - name: Install Python deps
        run: |
          pip install --upgrade pip
          pip install yt-dlp opencv-python-headless pytesseract requests

      - name: Run tracker
        env:
          KICK_URL: ${{ secrets.KICK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          KICK_CURL: ${{ secrets.KICK_CURL }} 
          PYTHONUNBUFFERED: 1
        run: python tracker.py
